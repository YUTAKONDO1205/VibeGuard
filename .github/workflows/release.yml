name: Release

# Tag-driven release. Pushing a tag like `v0.1.1` triggers this workflow,
# which builds everything fresh, attaches CLI tarball + VSIX + Chrome zip
# to a GitHub release, and (when the matching secrets are set) publishes
# to npm, the VS Code Marketplace, and Open VSX.
#
# To cut a release manually instead of by tag, use the workflow_dispatch
# entry-point (Actions tab → Release → Run workflow). The job runs on
# the dispatch ref, so create the tag first and dispatch from it.
on:
  push:
    tags:
      # Full versions only. The moving major tag `v0`, which the composite action
      # tells consumers to reference, gets force-pushed to the newest release
      # after every publish — and under a bare `v*` that re-entered this workflow
      # and failed the "CLI version matches tag" check, because `0` is not
      # `0.2.0`. A red run that means "the tag was repointed successfully" is
      # worse than no run: it trains people to ignore release failures.
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'  # prereleases: v1.0.0-rc.1
  workflow_dispatch:

permissions:
  contents: write  # needed to create the GitHub release + upload assets

jobs:
  release:
    name: Build, package, and publish
    runs-on: ubuntu-latest
    # Surfacing the secrets at job level lets the conditional `if: env.X != ''`
    # checks below decide whether to skip a publish channel. Missing secrets
    # resolve to empty strings (not an error) so a contributor can cut a
    # GitHub release without having both channels wired up.
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history so the release notes can reference prior tags

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      # Resolve the version from the ref. Tag pushes give us refs/tags/vX.Y.Z;
      # workflow_dispatch falls back to the version field of the root
      # package.json so a manual run still has a sensible label.
      - name: Resolve release version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing v${VERSION}"

      - run: npm ci

      - run: npm run build

      # The release-time invariants, run on the release path.
      #
      # ci.yml already runs these on every push and pull request, so this looks
      # redundant — and it is, right up until the one run where it is not. This
      # job is the only one that produces the bytes users install, it is
      # triggered by a TAG rather than by a push (so a tag can point at a commit
      # whose CI never completed, or completed before a later change to a
      # workflow file), and everything it checks is cheap. The failure it exists
      # to prevent — a shipped bundle that acquired something it must not carry —
      # is invisible in the artefact and permanent once published.
      - name: Check packaging invariants
        run: node scripts/check-packaging-invariants.mjs

      # Sanity-check: the package.json version in apps/cli (the published
      # artifact) must match the tag. Catches "forgot to bump" mistakes
      # before we create a misnamed release.
      - name: Verify CLI version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./apps/cli/package.json').version")
          if [[ "$PKG_VERSION" != "${{ steps.version.outputs.version }}" ]]; then
            echo "::error::apps/cli version $PKG_VERSION does not match release ${{ steps.version.outputs.version }}"
            exit 1
          fi

      # ── Package CLI tarball ──────────────────────────────────────────────
      #
      # THE TARBALL IS THE ONLY WAY A HUMAN INSTALLS THE CLI. It is not on npm
      # and never will be (see the note further down), so this asset is the
      # artefact the README points at. Up to 0.3.4 it was uninstallable: the
      # `tsc` build left `dist/index.js` importing `@vibeguard/analyzer-core`
      # and the manifest declared six `@vibeguard/*` runtime dependencies whose
      # names exist on no registry, so `npm i vibeguard-cli-X.Y.Z.tgz` failed to
      # resolve them and stopped. Nothing in this workflow noticed, because
      # `npm pack` succeeds perfectly well on a package that cannot be
      # installed.
      #
      # `apps/cli` is now bundled by esbuild (`apps/cli/build.mjs`): one
      # self-contained `dist/index.js`, zero runtime dependencies, `"files":
      # ["dist"]`. The three steps below are ordered so that the thing we
      # upload is the thing we proved installable, in that order.
      - name: Pack CLI tarball
        id: cli
        run: |
          # `npm pack -w @vibeguard/cli` writes the tarball to the workspace
          # directory by default. Move it to repo root for the release upload.
          #
          # The bundle is (re)built here by the workspace's own `prepack`
          # script, which npm runs for `npm pack`. That is belt AND braces on
          # top of `npm run build` above, and both are wanted: the root build is
          # what a human runs, `prepack` is what makes the tarball correct even
          # if someone packs without it. `--ignore-scripts` would defeat it —
          # which is why the verification step below reads the packed bytes
          # rather than trusting that the build ran.
          npm pack --workspace @vibeguard/cli --pack-destination .
          ls -la vibeguard-cli-*.tgz
          echo "tarball=$(ls vibeguard-cli-*.tgz)" >> "$GITHUB_OUTPUT"

      # ── Prove the tarball installs and runs, before it becomes a release ──
      #
      # `npm pack` exiting 0 says nothing about installability, and that gap is
      # exactly how a broken artefact shipped for several releases. This step
      # closes it with the only test that counts: install the packed bytes into
      # an EMPTY directory with no workspace, no node_modules and no registry
      # entry to fall back on, then run the binary and require findings.
      #
      # Three assertions, each guarding a different failure:
      #   1. the packed manifest declares no `@vibeguard/*` runtime dependency —
      #      the direct cause of the old breakage, checked on the packed bytes
      #      rather than on the source manifest;
      #   2. `npm i <tarball>` succeeds in isolation and the binary runs;
      #   3. it finds a NON-ZERO number of findings in samples/vulnerable. This
      #      is the assertion that matters most and the one a naive check omits:
      #      a bundle that tree-shook the rule registry away still installs,
      #      still runs, still exits 0 — and reports nothing. "Clean scan" and
      #      "dead scanner" are the same output, so the count has to be checked.
      - name: Verify the tarball installs and scans in isolation
        run: |
          set -euo pipefail
          TARBALL="$PWD/${{ steps.cli.outputs.tarball }}"

          mkdir -p /tmp/vg-tarball-check
          tar -xzf "$TARBALL" -C /tmp/vg-tarball-check
          node -e '
            const pkg = require("/tmp/vg-tarball-check/package/package.json");
            const vg = Object.keys(pkg.dependencies || {}).filter((n) => n.startsWith("@vibeguard/"));
            if (vg.length > 0) {
              console.error("::error::the packed manifest declares @vibeguard/* runtime dependencies: " + vg.join(", "));
              console.error("Those names are not on any registry, so this tarball cannot be installed.");
              console.error("They belong in devDependencies; the packages are inlined by apps/cli/build.mjs.");
              process.exit(1);
            }
            console.log("packed manifest declares " + Object.keys(pkg.dependencies || {}).length + " runtime dependencies");
          '

          # An empty directory outside the workspace: nothing here can be
          # satisfied by a hoisted node_modules or a workspace symlink.
          mkdir -p /tmp/vg-install && cd /tmp/vg-install
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$TARBALL"
          ./node_modules/.bin/vibeguard --version

          cd "$GITHUB_WORKSPACE"
          /tmp/vg-install/node_modules/.bin/vibeguard samples/vulnerable \
            --mode standard --format json --fail-on never --out /tmp/vg-install/scan.json
          node -e '
            const n = require("/tmp/vg-install/scan.json").findings.length;
            if (n === 0) {
              console.error("::error::the installed CLI reported ZERO findings on samples/vulnerable.");
              console.error("It installed and exited 0, so nothing else in this job would have noticed.");
              console.error("A bundle that lost the rule registry looks exactly like a clean repository.");
              process.exit(1);
            }
            console.log("installed CLI reported " + n + " findings on samples/vulnerable");
          '

      # ── Package VS Code extension ────────────────────────────────────────
      # --no-dependencies avoids resolving workspace symlinks into the VSIX
      # (which bloats it past 10 MB and trips Marketplace secret scanning
      # on test fixture tokens). See docs/runbooks/publish-vscode-extension.md.
      - name: Package VSIX
        id: vsix
        working-directory: extensions/vscode
        run: |
          npx vsce package --no-dependencies
          ls -la *.vsix
          echo "vsix=$(ls *.vsix)" >> "$GITHUB_OUTPUT"

      # ── Package Chrome extension zip ────────────────────────────────────
      - name: Package Chrome extension zip
        id: chrome
        run: |
          ZIP_NAME="vibeguard-chrome-${{ steps.version.outputs.version }}.zip"
          (cd extensions/chrome/dist && zip -r "../../../$ZIP_NAME" .)
          ls -la "$ZIP_NAME"
          echo "zip=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      # ── Create / update the GitHub Release with all three artifacts ─────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ steps.version.outputs.version }}
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            ${{ steps.cli.outputs.tarball }}
            extensions/vscode/${{ steps.vsix.outputs.vsix }}
            ${{ steps.chrome.outputs.zip }}

      # ── Conditional publish steps ───────────────────────────────────────
      # Each step runs only when its secret is configured. Missing a secret
      # is not an error — it lets a contributor cut a GitHub release without
      # having both publishing channels wired up.
      #
      # The CLI is NOT published to npm, deliberately and permanently. It ships
      # as the tarball attached to the release above (README points there), and
      # for CI as the composite action, which builds from the checkout and never
      # resolves `@vibeguard/cli` from a registry. Nothing here should grow an
      # `npm publish` step back: the package name is unclaimed on the registry,
      # so publishing would newly expose a name that has never been ours.

      - name: Publish VSIX to VS Code Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        working-directory: extensions/vscode
        run: |
          npx vsce publish \
            --packagePath "${{ steps.vsix.outputs.vsix }}" \
            --no-dependencies \
            --pat "$VSCE_PAT"

      - name: Publish VSIX to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        working-directory: extensions/vscode
        run: |
          npx ovsx publish "${{ steps.vsix.outputs.vsix }}" -p "$OVSX_PAT"
