name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # Before the build, because this catches the class of breakage that only
      # shows up at `vsce package` time — i.e. on a release tag, weeks after the
      # commit that caused it. Cheap, no build required, and it fails with the
      # fix spelled out rather than with a packaging error.
      #
      # --pre-build runs only the invariants that read source and manifests.
      # The bundle-leak and bundle-size invariants need extensions/*/dist and
      # therefore run after the build, in the step below. They are NOT skipped
      # here — the flag makes this step promise less, so that a missing artefact
      # can stay a hard failure where it is genuinely a failure.
      - name: Check packaging invariants (source-only)
        run: node scripts/check-packaging-invariants.mjs --pre-build

      # Disclosure shapes, not disclosure words. Three things reached this
      # repository's public history that a word list could not have caught: a
      # label spelled in a form nobody enumerated, a path carrying one machine's
      # account name, and an ignore file that annotated why each withheld path
      # was withheld. This check matches the SHAPES those take and contains no
      # proper noun, which is what lets it run here at all — a checker that lists
      # what it forbids would publish the list to every reader of this file and
      # to the archived log of every run.
      #
      # It exits 3 rather than 0 when it scanned nothing or when a needle failed
      # against its own positive control: a confident zero from a broken needle
      # is how the label above survived several audits.
      - name: Check for disclosure-shaped strings
        run: node scripts/check-disclosure-shape.mjs

      - run: npm run build

      # Now that the extensions are built, check the shipped artefacts. This is
      # the half that enforces the 0.3.0-α package separation: no cross-file
      # analysis code inside a browser or editor bundle. A missing dist here is
      # a failure, not a skip.
      - name: Check packaging invariants (shipped bundles)
        run: node scripts/check-packaging-invariants.mjs

      - run: npm test

  # Cross-channel judgment consistency (paper item ②). Proves the built node
  # entry (CLI / Action `scanPath`) and the built browser entry (Chrome / VS
  # Code `scan`) emit identical findings on the same inputs. Blocking: a
  # divergence means the four channels disagree, which is a correctness bug.
  consistency-e2e:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      - name: Assert node/browser paths agree
        run: node scripts/e1-consistency-eval.mjs >> "$GITHUB_STEP_SUMMARY"

  # H2 — the self-hardening gate. VibeGuard
  # regression-tests its OWN attack surface here: the ReDoS surface of the rule
  # regexes (A1), the evasion rate of rewrites against the shipped detector (B1),
  # the concealment rate of triage-abuse disguises (B3), and the finding SETS of
  # the sample corpora. Thresholds live in the tracked
  # scripts/sec-selftest-baseline.json, so moving one is a reviewed diff.
  #
  # BLOCKING, deliberately, and with no `continue-on-error`: unlike perf-bench
  # below, every number this job compares is deterministic — the generators
  # declare (and were measured to have) no clock and no RNG — so a red run means
  # a real regression, never CI weather. The one arm that WOULD be weather-
  # dependent, wall-clock ReDoS timing, is deliberately not a gate here; that
  # property is asserted in packages/analyzer-core/src/redos-invariant.test.ts
  # under `npm test`, where a generous per-test budget is affordable.
  #
  # The B1/B3 corpora are REGENERATED here rather than checked out: they live
  # under security-experiment/, which .gitignore excludes on purpose (attack
  # premises stay out of the public service repo), so on a runner they do not
  # exist. Their inputs — samples/vulnerable and test_problem — are tracked, and
  # the generators are deterministic, which is what makes the tracked baseline
  # comparable run to run. Budget ~30 s, dominated by B1 corpus generation.
  #
  # ⚠ Making this a REQUIRED status check is a branch-protection setting in the
  # GitHub repository configuration. It cannot be expressed in this file, and
  # nothing here should be read as having done it.
  security-selftest:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      # `tee` into RUNNER_TEMP rather than the workspace so the log cannot show
      # up as an untracked file in a later step. `set -o pipefail` is what keeps
      # the gate's exit code from being swallowed by tee — without it this job
      # would report the exit status of `tee`, i.e. always success, which is the
      # exact failure mode a self-hardening gate must not have.
      - name: Self-hardening gate (A1 / B1 / B3 / corpora)
        shell: bash
        run: |
          set -o pipefail
          node scripts/sec-selftest.mjs | tee "$RUNNER_TEMP/selftest.log"

      - name: Render self-hardening report
        if: always()
        shell: bash
        run: |
          {
            echo '## VibeGuard self-hardening selftest (H2)'
            echo ''
            echo '```'
            cat "$RUNNER_TEMP/selftest.log" 2>/dev/null || echo '(the gate produced no output — it failed before reporting)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The robustness metrics themselves, for trend-watching across runs. This
      # is the local record (§5.5's `_results/manifest.json`), NOT the gate's
      # authority — the authority is the tracked baseline, and nothing in CI ever
      # writes back to it.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-selftest-manifest
          path: security-experiment/_results/manifest.json
          retention-days: 30
          if-no-files-found: warn

  # Performance benchmark. Non-blocking by default — it fails only when a
  # workload exceeds 2× its design-§11.1 target (see scripts/perf-bench.mjs).
  # The JSON output is uploaded as an artifact so a future PR can plot trends.
  perf-bench:
    runs-on: ubuntu-latest
    # Don't wedge the merge queue on a noisy CI VM. The hard 2× gate is the
    # real guard; the soft target is just for the artifact.
    continue-on-error: true
    needs: build-test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      - name: Run perf benchmark
        run: npm run bench -- --json > perf-bench.json
        # Even if a workload "fails" (exceeds 2× target), we still want the
        # artifact so the trend is visible. The exit code is preserved via
        # continue-on-error at the job level.

      - name: Render human-readable summary
        if: always()
        run: |
          echo '## VibeGuard perf bench' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          npm run --silent bench >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-bench
          path: perf-bench.json
          retention-days: 30

  # The native toolchain workspace under compiler/.
  #
  # It sits outside the npm workspaces on purpose — it is a research toolchain,
  # not a shipped package — and the consequence went unnoticed: `npm test` walks
  # the workspaces, none of the five workflows named a path under compiler/, and
  # so its suites had only ever run on the machine that wrote them. The boundary
  # around the directory was enforced in CI (check-packaging-invariants asserts
  # it); what was inside the boundary was not.
  #
  # SCOPE, STATED RATHER THAN IMPLIED. This job runs the Node suites. The C++
  # components — the Clang frontend gate and the two LLVM passes — need cmake and
  # llvm-18-dev and are NOT built here. A green tick on this job means the Node
  # side is exercised, not that the toolchain is.
  # NOTE ON THE JOB NAME. It does not repeat the directory's name, and that is
  # not stylistic: the naming guard treats that word as legitimate only under the
  # directory itself and in the two git dotfiles that have to spell it, so a job
  # named after it is a hit. Paths pointing INTO the directory are fine — those
  # are the scoped form. The guard caught this the first time it was written the
  # other way round, which is the behaviour wanted from it.
  native-toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      # The driver's end-to-end tests compile with a real clang and skip
      # themselves when there is none. Installing it is the difference between
      # asserting something and showing a green tick over a skipped suite; the
      # step after this one fails the job if they skipped anyway.
      - name: Install clang-18
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18

      - name: Driver
        run: node --test compiler/driver/test/

      # A suite that skipped itself reports the same green as a suite that
      # passed. These tests skip when there is no usable toolchain, which on a
      # runner means the apt step above silently did not give us one — the case
      # this job exists to rule out. Measured locally: 20 of 21 skip without
      # clang, 0 with it. The count is read positionally rather than by output
      # format, because `node --test` prints TAP on node 20 and a spec-style
      # summary on newer ones, and the format is not what is being asserted.
      - name: Assert the live-build tests were not skipped
        run: |
          out=$(node --test compiler/driver/test/driver-e2e.test.mjs 2>&1) || true
          echo "$out" | tail -12
          skipped=$(echo "$out" | awk '/skipped/ {for (i = 1; i <= NF; i++) if ($i == "skipped") { print $(i + 1); exit }}')
          if [ "${skipped:-unknown}" != "0" ]; then
            echo "::error::${skipped} live-build test(s) skipped — clang was not usable, so this job proved less than its green tick suggests"
            exit 1
          fi

      - name: ELF verifier
        working-directory: compiler/elf-verifier
        run: node test-units.mjs

      - name: Evidence canonicaliser
        working-directory: compiler/evidence
        run: node verify.mjs --self-test

      - name: Evidence clock audit
        working-directory: compiler/evidence
        run: node verify.mjs --clock-audit
