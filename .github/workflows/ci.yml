name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # scripts/ref-freshness.test.ts and scripts/sweep-disclosure.test.ts build
      # their fixtures from `git for-each-ref refs/remotes/origin`, because the
      # thing under test is whether a local ref agrees with the remote. On a
      # `push` run the checkout leaves one such ref behind and the tests run; on
      # a `pull_request` run it checks out the merge ref detached and leaves
      # none, so the fixture comes out empty and five assertions fail for a
      # reason that has nothing to do with the code in the pull request.
      #
      # Measured: every pull_request run of this workflow has failed at `npm
      # test` since those tests landed, while `push` runs on the default branch
      # stayed green — so the signal a reviewer reads on a PR had already been
      # destroyed, quietly, by an environment difference.
      #
      # Fetching the branch refs makes the precondition true, which is better
      # than the alternatives: skipping the tests on PRs would take a gate off
      # exactly the runs a reviewer looks at, and asserting nothing when the
      # fixture is empty is the silent pass this repository refuses everywhere
      # else. Nothing here weakens a check — it gives one the input it needs.
      - name: Fetch branch refs (the freshness tests read refs/remotes/origin)
        run: git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # Before the build, because this catches the class of breakage that only
      # shows up at `vsce package` time — i.e. on a release tag, weeks after the
      # commit that caused it. Cheap, no build required, and it fails with the
      # fix spelled out rather than with a packaging error.
      #
      # --pre-build runs only the invariants that read source and manifests.
      # The bundle-leak and bundle-size invariants need extensions/*/dist and
      # therefore run after the build, in the step below. They are NOT skipped
      # here — the flag makes this step promise less, so that a missing artefact
      # can stay a hard failure where it is genuinely a failure.
      - name: Check packaging invariants (source-only)
        run: node scripts/check-packaging-invariants.mjs --pre-build

      # Disclosure shapes, not disclosure words. Three things reached this
      # repository's public history that a word list could not have caught: a
      # label spelled in a form nobody enumerated, a path carrying one machine's
      # account name, and an ignore file that annotated why each withheld path
      # was withheld. This check matches the SHAPES those take and contains no
      # proper noun, which is what lets it run here at all — a checker that lists
      # what it forbids would publish the list to every reader of this file and
      # to the archived log of every run.
      #
      # It exits 3 rather than 0 when it scanned nothing or when a needle failed
      # against its own positive control: a confident zero from a broken needle
      # is how the label above survived several audits.
      - name: Check for disclosure-shaped strings
        run: node scripts/check-disclosure-shape.mjs

      # The step above runs the detector. This one runs it again through the
      # sweep that verifies the instrument first, because the detector was never
      # the thing that broke — the plumbing around it was, twice, and both times
      # the symptom was a small confident zero that nobody re-ran.
      #
      # Before it says anything about the tree, the sweep writes known-positive
      # files to disk, hands their paths to the detector as a real child process,
      # and checks that every planted needle came back byte for byte. A needle
      # that goes missing between this runner and the matcher stops the run with
      # exit 3 and NO reading, which is the only honest output from a broken
      # instrument. It also fails when nothing was scanned, so an empty sweep can
      # never be reported as a clean one.
      #
      # The freshness half is skipped here on purpose and the skip is printed:
      # the gate exists to catch an audit conducted against a stale
      # remote-tracking ref, and a fresh CI checkout has nothing to be stale
      # against. The verdict downgrades itself to "CLEAN against the local refs"
      # rather than claiming more than it checked.
      - name: Disclosure sweep (instrument verified before the reading)
        env:
          VG_SWEEP_ALLOW_STALE_REF: '1'
        run: node scripts/sweep-disclosure.mjs

      - run: npm run build

      # Now that the extensions are built, check the shipped artefacts. This is
      # the half that enforces the 0.3.0-α package separation: no cross-file
      # analysis code inside a browser or editor bundle. A missing dist here is
      # a failure, not a skip.
      - name: Check packaging invariants (shipped bundles)
        run: node scripts/check-packaging-invariants.mjs

      - run: npm test

  # Cross-channel judgment consistency (evaluation E1). Proves the built node
  # entry (CLI / Action `scanPath`) and the built browser entry (Chrome / VS
  # Code `scan`) emit identical findings on the same inputs. Blocking: a
  # divergence means the four channels disagree, which is a correctness bug.
  consistency-e2e:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      - name: Assert node/browser paths agree
        run: node scripts/e1-consistency-eval.mjs >> "$GITHUB_STEP_SUMMARY"

  # H2 — the self-hardening gate. VibeGuard
  # regression-tests its OWN attack surface here: the ReDoS surface of the rule
  # regexes (A1), the evasion rate of rewrites against the shipped detector (B1),
  # the concealment rate of triage-abuse disguises (B3), and the finding SETS of
  # the sample corpora. Thresholds live in the tracked
  # scripts/sec-selftest-baseline.json, so moving one is a reviewed diff.
  #
  # BLOCKING, deliberately, and with no `continue-on-error`: unlike perf-bench
  # below, every number this job compares is deterministic — the generators
  # declare (and were measured to have) no clock and no RNG — so a red run means
  # a real regression, never CI weather. The one arm that WOULD be weather-
  # dependent, wall-clock ReDoS timing, is deliberately not a gate here; that
  # property is asserted in packages/analyzer-core/src/redos-invariant.test.ts
  # under `npm test`, where a generous per-test budget is affordable.
  #
  # The B1/B3 corpora are REGENERATED here rather than checked out: they live in
  # an ignored working directory, so on a runner they do not exist. (Why that
  # directory is withheld is deliberately not recorded here — a workflow file is
  # as public as an ignore file, and the same reasoning applies to both.) Their
  # inputs — samples/vulnerable and test_problem — are tracked, and
  # the generators are deterministic, which is what makes the tracked baseline
  # comparable run to run. Budget ~30 s, dominated by B1 corpus generation.
  #
  # ⚠ Making this a REQUIRED status check is a branch-protection setting in the
  # GitHub repository configuration. It cannot be expressed in this file, and
  # nothing here should be read as having done it.
  security-selftest:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      # `tee` into RUNNER_TEMP rather than the workspace so the log cannot show
      # up as an untracked file in a later step. `set -o pipefail` is what keeps
      # the gate's exit code from being swallowed by tee — without it this job
      # would report the exit status of `tee`, i.e. always success, which is the
      # exact failure mode a self-hardening gate must not have.
      # `--redact-metrics` is what makes this step safe to run in public. The
      # B1/B3 gates compare measured evasion and concealment rates against the
      # tracked baseline, and those rates are the headline numbers of a
      # write-up that has not been published. Without the flag every run put
      # them on three readable surfaces at once: this job log (the tee below
      # prints to stdout), the run page's step summary rendered from the same
      # log, and the artefact that used to be uploaded at the end of this job.
      # Measured on run 31353542731 before the fix — the log carried the rates
      # verbatim. The flag withholds the readings and keeps everything that
      # makes the gate a gate: the verdict per gate, the gate ids, the
      # failed-gate list, and the exit status. A regression is still red here;
      # the maintainer reruns without the flag locally to see by how much.
      - name: Self-hardening gate (A1 / B1 / B3 / corpora)
        shell: bash
        run: |
          set -o pipefail
          node scripts/sec-selftest.mjs --redact-metrics | tee "$RUNNER_TEMP/selftest.log"

      - name: Render self-hardening report
        if: always()
        shell: bash
        run: |
          {
            echo '## VibeGuard self-hardening selftest (H2)'
            echo ''
            echo '```'
            cat "$RUNNER_TEMP/selftest.log" 2>/dev/null || echo '(the gate produced no output — it failed before reporting)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # THE MANIFEST IS DELIBERATELY NOT UPLOADED, and this comment is the
      # record of why so nobody adds the step back for trend-watching.
      #
      # It used to be uploaded under its own name, retained 30 days. That name
      # is deliberately not written here — the test in
      # scripts/sec-selftest.test.ts asserts the whole file does not contain it,
      # so a comment that spelled it out would either fail the test or force the
      # test to be weakened into something a re-added step could slip past. On a
      # public repository an artefact is a public download: no token, no
      # membership, just the run page. The file it carried is the run record of
      # the B1 and B3 arms, and its `metrics` objects are the measured evasion
      # and concealment rates of an unpublished write-up — not a summary of
      # them, the numbers themselves. Measured 2026-08-10: 357 artefacts
      # existed, many unexpired, the newest from that morning's run.
      #
      # The gate never needed it. Its authority is the tracked baseline, the
      # comparison happens in-process, and nothing in CI has ever written back.
      # The artefact existed only so a future PR could plot a trend, which is
      # not worth a standing public disclosure. The manifest is still written
      # on the runner and still read by the gate in the same job; it simply
      # stops leaving it. Trends are read locally, from a run without
      # `--redact-metrics`.

  # Performance benchmark. Non-blocking by default — it fails only when a
  # workload exceeds 2× its target in docs/DESIGN.ja.md §10.1 (see
  # scripts/perf-bench.mjs). The section number is cited against the design doc
  # that ships in this repository, deliberately: the number this line used to
  # carry indexed a document that is not published, which tells a reader that
  # such a document exists and how it is laid out, and cannot be looked up.
  # The JSON output is uploaded as an artifact so a future PR can plot trends.
  perf-bench:
    runs-on: ubuntu-latest
    # Don't wedge the merge queue on a noisy CI VM. The hard 2× gate is the
    # real guard; the soft target is just for the artifact.
    continue-on-error: true
    needs: build-test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      - name: Run perf benchmark
        run: npm run bench -- --json > perf-bench.json
        # Even if a workload "fails" (exceeds 2× target), we still want the
        # artifact so the trend is visible. The exit code is preserved via
        # continue-on-error at the job level.

      - name: Render human-readable summary
        if: always()
        run: |
          echo '## VibeGuard perf bench' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          npm run --silent bench >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-bench
          path: perf-bench.json
          retention-days: 30

  # The native toolchain workspace under compiler/.
  #
  # It sits outside the npm workspaces on purpose — it is a research toolchain,
  # not a shipped package — and the consequence went unnoticed: `npm test` walks
  # the workspaces, none of the five workflows named a path under compiler/, and
  # so its suites had only ever run on the machine that wrote them. The boundary
  # around the directory was enforced in CI (check-packaging-invariants asserts
  # it); what was inside the boundary was not.
  #
  # SCOPE, STATED RATHER THAN IMPLIED. This job runs the Node suites. The C++
  # components — the Clang frontend gate, the two LLVM observer passes and the
  # repair plugin under compiler/llvm-repair — need cmake and llvm-18-dev and are
  # NOT built here. A green tick on this job means the Node side is exercised, not
  # that the toolchain is. The native-plugins job below is the other half: it
  # builds every C++ component and runs the plugins' fixture loops.
  # NOTE ON THE JOB NAME. It does not repeat the directory's name, and that is
  # not stylistic: the naming guard treats that word as legitimate only under the
  # directory itself and in the two git dotfiles that have to spell it, so a job
  # named after it is a hit. Paths pointing INTO the directory are fine — those
  # are the scoped form. The guard caught this the first time it was written the
  # other way round, which is the behaviour wanted from it.
  native-toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      # The driver's end-to-end tests compile with a real clang and skip
      # themselves when there is none. Installing it is the difference between
      # asserting something and showing a green tick over a skipped suite; the
      # step after this one fails the job if they skipped anyway.
      - name: Install clang-18
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18

      # The glob is unquoted so the SHELL expands it, not node. Passing the
      # directory is what the component's README says, and it throws
      # MODULE_NOT_FOUND on newer runtimes; quoting the glob makes node do the
      # matching, which older ones cannot. Shell expansion is the form that works
      # on both, and it fails loudly if the directory is ever empty.
      - name: Driver
        run: node --test compiler/driver/test/*.test.mjs

      # A suite that skipped itself reports the same green as a suite that
      # passed. These tests skip when there is no usable toolchain, which on a
      # runner means the apt step above silently did not give us one — the case
      # this job exists to rule out. Measured locally: 20 of 21 skip without
      # clang, 0 with it. The count is read positionally rather than by output
      # format, because `node --test` prints TAP on node 20 and a spec-style
      # summary on newer ones, and the format is not what is being asserted.
      - name: Assert the live-build tests were not skipped
        run: |
          out=$(node --test compiler/driver/test/driver-e2e.test.mjs 2>&1) || true
          # 21 cases in this file; 20 of them need a toolchain.
          echo "$out" | tail -12
          skipped=$(echo "$out" | awk '/skipped/ {for (i = 1; i <= NF; i++) if ($i == "skipped") { print $(i + 1); exit }}')
          if [ "${skipped:-unknown}" != "0" ]; then
            echo "::error::${skipped} live-build test(s) skipped — clang was not usable, so this job proved less than its green tick suggests"
            exit 1
          fi

      - name: ELF verifier
        working-directory: compiler/elf-verifier
        run: node test-units.mjs

      - name: Evidence canonicaliser
        working-directory: compiler/evidence
        run: node verify.mjs --self-test

      - name: Evidence clock audit
        working-directory: compiler/evidence
        run: node verify.mjs --clock-audit

      # The two steps above run the canonicaliser's own self-checks, which is a
      # different thing from running its test suite — and the suites of the five
      # components below were reaching no runner at all. They arrived with their
      # directories and nothing named them, so the only thing standing between a
      # regression in them and a release was that nobody had touched them yet.
      # Measured: 0 failed and 0 skipped for every one — evidence 72, provenance
      # 55, schema 26, llvm-pass 45, pass-instrumentation 96, which is 294
      # assertions that were previously running nowhere.
      #
      # WHY EACH STEP COUNTS ITS OWN INPUTS FIRST. `node --test` exits 0 when the
      # glob matched nothing: an unmatched pattern is passed through literally,
      # node finds no such file, and the run reports success. Two of the five
      # paths below were wrong on the first attempt for exactly that reason and
      # the steps went green anyway. A step that cannot tell "the suite passed"
      # from "the suite was not there" is the failure mode the rest of this
      # repository refuses, so the count is asserted before the suite runs.
      #
      # `envelope` was added once it had been seen green ON LINUX rather than on
      # the machine it was written on: 121/121 with 0 skipped under node 18 with
      # clang-18 present, which is this job. The distinction matters here more
      # than elsewhere, because 44 cases in the driver suite are skipped on the
      # author's platform and execute on this one.
      #
      # `fingerprint` and `link-wrapper` are deliberately NOT here. Their suites
      # need a real compiler and linker reached directly (21 and 15 cases fail
      # outright without one, by design; each has an env var that converts the
      # failure into a named skip). They belong in this job, which installs
      # clang-18 — but nobody has yet seen them green on a runner, and adding an
      # unmeasured step here is how main was last left red across five commits.
      # Filed rather than guessed.
      #
      # `elf-verifier` is the sharpest instance of the distinction this comment
      # block already draws for `evidence`, and it went unnoticed for the same
      # reason. The "ELF verifier" step above runs `test-units.mjs`, which is that
      # component's own self-check over two specific pieces — the mangled-name
      # scanner and the canonical record rules. Its test SUITE is
      # `test/*.test.mjs`, 80 cases, and nothing ran it. A named step mentioning
      # the component is what made it look covered: the list of what reaches no
      # runner was read as "components with no step", when the property that
      # matters is "suites with no runner".
      #
      # `observer`, `calibration` and `metamorphic` were the SAME omission as the
      # original five, found again three components later: they arrived with their
      # directories, nothing named them, and 42 more assertions were running
      # nowhere (observer 22, calibration 10, metamorphic 10). They are added here
      # rather than filed like `fingerprint` above because the reason for filing
      # that one does not apply: all three are pure JS over catalogues, schemas
      # and recorded text, they invoke no compiler at all — the only mentions of
      # `clang` in them are in prose comments — and they were seen green with 0
      # failed and 0 skipped before this step was written. Being toolchain-free
      # they would also run in the main job; they are in this one because this is
      # where every other `compiler/` suite already lives, and one list is easier
      # to keep honest than two.
      - name: compiler/ suites that reach no other runner
        run: |
          set -eu
          run_suite() {
            name=$1; shift
            n=$#
            for f in "$@"; do [ -e "$f" ] || { echo "::error::${name}: pattern matched no file (${f})"; exit 1; }; done
            [ "$n" -gt 0 ] || { echo "::error::${name}: no test files"; exit 1; }
            echo "--- ${name}: ${n} file(s)"
            node --test "$@"
          }
          run_suite evidence              compiler/evidence/test/*.test.mjs
          run_suite envelope              compiler/envelope/test/*.test.mjs
          run_suite provenance            compiler/provenance/test/*.test.mjs
          run_suite schema                compiler/schema/*.test.mjs
          run_suite llvm-pass             compiler/llvm-pass/scripts/*.test.mjs
          run_suite pass-instrumentation  compiler/pass-instrumentation/introduction/test/*.test.mjs
          run_suite observer              compiler/pass-instrumentation/observer/test/*.test.mjs
          run_suite calibration           compiler/eval/calibration/test/*.test.mjs
          run_suite metamorphic           compiler/eval/metamorphic/test/*.test.mjs
          run_suite ai-generated          compiler/eval/ai-generated/test/*.test.mjs
          run_suite repair-loop           compiler/eval/repair-loop/test/*.test.mjs
          run_suite elf-verifier          compiler/elf-verifier/test/*.test.mjs
          # WipePinGcc's Node suites need no plugin and no gcc: asm-presence
          # reads synthetic listings through the shared oracle, corpus-smoke
          # tests the smoke runner's pure row selection and body delta. The
          # suites that do need the plugin run in native-plugins below.
          run_suite gcc-repair            compiler/gcc-repair/test/*.test.mjs

  # The native plugins, built and run.
  #
  # native-toolchain above runs the Node suites and says in its own comment
  # that the C++ components are NOT built there. This job is the other half:
  # it builds the IR observer (compiler/llvm-pass), the LLVM repair plugin
  # WipePin (compiler/llvm-repair) and the GCC repair plugin WipePinGcc
  # (compiler/gcc-repair), and runs each plugin's fixture loop, whose checker
  # grades every cell against a fixed expectation table. Most expectations
  # were written from what the cell is for before it first ran; the ones taken
  # from a measurement say so beside them (check-gcc-fixture-loop.py's
  # `chkconst`, the level at which gcc-13 removes the stock wipe, and
  # check-fixture-loop.py's XTU_HELPER_DEFINED, whether an xtu executable still
  # defines the helper), and so does the one that changed after a first run (the
  # xtu cells' control, which changed with the fixture; both checkers' xtu
  # comments say why). Until
  # this job, those loops had only ever run on the machine that wrote them.
  #
  # It also builds the property observer (compiler/pass-instrumentation/observer)
  # and runs that plugin's non-invasiveness measurement, scripts/noninvasive.mjs,
  # which no workflow ran before; it had only been run by hand. Its 21 checks,
  # over the three translation units of the erasure fixture: at each of
  # -O0..-O3, that two plugin-free compiles agree (NI-01), that every object
  # file and the linked executable are byte-identical with and without the
  # plugin in a build where it recorded an observation (NI-02, NI-03), and that
  # at least one unit's identity is backed by one (NI-03b); that
  # -opt-bisect-limit=40 does change the -O2 object of target.c, so identity is
  # a result and not an artefact (NI-04, the negative control); that under that
  # limit the plugin still changes nothing and still observes (NI-05) and its
  # skipped-pass callback fires, at least one skipped-pass record (NI-06); that
  # clang-18, opt and libLLVM.so.1 have the same sha256 after the run as before
  # it (NI-07); and that ldd lists the plugin's libraries and none of them is a
  # libLLVM of its own (NI-08; an ldd that lists nothing fails it). The step
  # takes its verdict from the harness's JSON report as well as its exit code,
  # and the report has to name the .so this job built.
  #
  # The other four C++ components under compiler/ are built here too, and
  # only built: the AST gate (compiler/clang-plugin, IntentGate, which is why
  # libclang-18-dev is installed), the observer's synthetic ground truth
  # (pass-instrumentation/observer/rq2), the marker pass and the introduction
  # observer (pass-instrumentation/marker, /introduction). Nothing below runs
  # them; what this job shows for them is that they still build against the
  # pinned LLVM 18, so that no C++ component under compiler/ builds only on the
  # machine that wrote it.
  #
  # PINNED TO ubuntu-24.04, not ubuntu-latest, on purpose. The fixture loops'
  # expectations are measurements of clang 18.1.3 and gcc 13.3.0 as the 24.04
  # archive ships them — which level deletes the fixture's wipe, which form a
  # pinned zero fill takes (pxor + movaps, or rep stos at -Os on gcc), that
  # gcc-13 predefines _FORTIFY_SOURCE=3 when it optimises. A runner image that
  # moved to another release would move those, and the job would go red for a
  # reason that has nothing to do with the plugins; worse, a GCC plugin loads
  # only into the GCC it was built against.
  #
  # lld-18 is for the WipePin fixture loop's link-time cells (lto-full-linkline,
  # lto-thin-linkline, lto-thin-linkline-O0, lto-full-linkline-nofile): they
  # link LTO bitcode with -fuse-ld=lld and grade the one stderr line WipePin
  # prints when an LTO link loads it. The same loop's xtu cells (xtu-nolto,
  # xtu-full-*, xtu-thin-*) link executables from four units with it: a wipe
  # helper in another unit, which only the LTO link can inline.
  #
  # objdump comes from binutils, which gcc-13 depends on. Both loops' checkers
  # run it on their xtu executables (compiler/gcc-repair/scripts/objdump_fill.py
  # reads its output), and the WipePinGcc runner uses it for its lto group.
  # llvm-bcanalyzer-18 comes from llvm-18, which llvm-18-dev depends on. The
  # WipePin loop's checker runs it on the xtu cells' -flto objects: the block
  # each module summary is in says whether a cell was built thin or full, which
  # the bitcode magic alone does not.
  #
  # Every build goes to $RUNNER_TEMP, never into the checkout, so nothing a
  # build writes can show up as an untracked file or be picked up by a later
  # step as if it were source. A .so that is missing after its build is a
  # failure here, not something a later step discovers by skipping.
  native-plugins:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # The two fixture-loop checkers read listings through the repository's
      # assembly oracle, which is Node.
      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install clang-18, llvm-18-dev, libclang-18-dev, lld-18, gcc-13 and the GCC plugin headers
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18-dev libclang-18-dev lld-18 cmake ninja-build python3 gcc-13 g++-13 gcc-13-plugin-dev

      # Printed, so a red run can be read against the versions the fixture
      # expectations were measured with (clang 18.1.3, gcc 13.3.0).
      - name: Toolchain versions
        run: |
          set -u
          clang-18 --version | head -1
          gcc-13 --version | head -1
          for p in clang-18 llvm-18-dev libclang-18-dev lld-18 cmake ninja-build python3 gcc-13 g++-13 gcc-13-plugin-dev; do
            dpkg-query -W -f='${Package} ${Version}\n' "$p"
          done

      - name: Build the IR observer (llvm-pass)
        run: |
          set -u
          cmake -S compiler/llvm-pass -B "$RUNNER_TEMP/build/llvm-pass" -G Ninja -DLLVM_DIR="$(llvm-config-18 --cmakedir)"
          ninja -C "$RUNNER_TEMP/build/llvm-pass"

      - name: Build the property observer (pass-instrumentation/observer)
        run: |
          set -u
          cmake -S compiler/pass-instrumentation/observer -B "$RUNNER_TEMP/build/pass-observer" -G Ninja -DLLVM_DIR="$(llvm-config-18 --cmakedir)"
          ninja -C "$RUNNER_TEMP/build/pass-observer"

      - name: Build WipePin (llvm-repair)
        run: |
          set -u
          cmake -S compiler/llvm-repair -B "$RUNNER_TEMP/build/llvm-repair" -G Ninja -DLLVM_DIR="$(llvm-config-18 --cmakedir)"
          ninja -C "$RUNNER_TEMP/build/llvm-repair"

      # CXX picks g++-13 the way the component's README does with its cmake
      # flag: a GCC plugin has to be built by the GCC it will load into, and
      # the CMakeLists refuses any other C++ front end.
      - name: Build WipePinGcc (gcc-repair)
        env:
          CXX: g++-13
        run: |
          set -u
          cmake -S compiler/gcc-repair -B "$RUNNER_TEMP/build/gcc-repair" -G Ninja
          ninja -C "$RUNNER_TEMP/build/gcc-repair"

      # Built only (see the job comment). clang-plugin needs Clang's CMake
      # package as well as LLVM's, from libclang-18-dev.
      - name: Build the other C++ components (build only)
        run: |
          set -u
          llvm_dir="$(llvm-config-18 --cmakedir)"
          cmake -S compiler/clang-plugin -B "$RUNNER_TEMP/build/clang-plugin" -G Ninja -DLLVM_DIR="$llvm_dir" -DClang_DIR=/usr/lib/llvm-18/lib/cmake/clang
          ninja -C "$RUNNER_TEMP/build/clang-plugin"
          for d in observer/rq2 marker introduction; do
            b="$RUNNER_TEMP/build/pi-$(printf '%s' "$d" | tr '/' '-')"
            cmake -S "compiler/pass-instrumentation/$d" -B "$b" -G Ninja -DLLVM_DIR="$llvm_dir"
            ninja -C "$b"
          done

      - name: Assert every plugin and the digest calibrator exist
        run: |
          set -u
          missing=0
          for f in "$RUNNER_TEMP/build/llvm-pass/libIrCheckpoints.so" \
                   "$RUNNER_TEMP/build/pass-observer/libPropertyObserver.so" \
                   "$RUNNER_TEMP/build/llvm-repair/libWipePin.so" \
                   "$RUNNER_TEMP/build/gcc-repair/libWipePinGcc.so" \
                   "$RUNNER_TEMP/build/gcc-repair/canon-vectors" \
                   "$RUNNER_TEMP/build/clang-plugin/libIntentGate.so" \
                   "$RUNNER_TEMP/build/pi-observer-rq2/libSyntheticGroundTruth.so" \
                   "$RUNNER_TEMP/build/pi-marker/libMarkerPass.so" \
                   "$RUNNER_TEMP/build/pi-introduction/libIntroductionObserver.so"; do
            if [ -s "$f" ]; then
              echo "$(sha256sum "$f" | cut -d' ' -f1)  $(basename "$f")"
            else
              echo "::error::$(basename "$f") was not built"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      # The runner decides nothing and the checker builds nothing: the checker's
      # exit code is the verdict (0 every expectation held, 2 one did not, 3 a
      # record was missing). The runner's own exit is checked too, because a
      # cell that produced no record is reported there first.
      - name: WipePin fixture loop (run, then check)
        run: |
          set -u
          lab="$RUNNER_TEMP/lab/llvm-repair"
          bash compiler/llvm-repair/scripts/run-fixture-loop.sh --lab "$lab" \
               --observer "$RUNNER_TEMP/build/llvm-pass/libIrCheckpoints.so" \
               --wipepin "$RUNNER_TEMP/build/llvm-repair/libWipePin.so"
          python3 compiler/llvm-repair/scripts/check-fixture-loop.py --lab "$lab"

      - name: WipePinGcc fixture loop (run, then check)
        run: |
          set -u
          lab="$RUNNER_TEMP/lab/gcc-repair"
          bash compiler/gcc-repair/scripts/run-gcc-fixture-loop.sh --lab "$lab" \
               --plugin "$RUNNER_TEMP/build/gcc-repair/libWipePinGcc.so"
          python3 compiler/gcc-repair/scripts/check-gcc-fixture-loop.py --lab "$lab"

      # WipePinGcc cannot link libLLVM, so it has a second writer of the
      # canonical record text; the shared vectors are what keep the two
      # writers, and the Node reader, agreeing.
      - name: WipePinGcc digest calibration (canon-vectors)
        run: |
          "$RUNNER_TEMP/build/gcc-repair/canon-vectors" compiler/evidence/testdata/digest-vectors.json

      # Run as files: the directory name is not a Python package name, so
      # `python3 -m unittest` cannot address them. A 0-byte file would run as
      # a script that does nothing and exit 0, and a file that no longer calls
      # unittest.main() would too, so each file must be non-empty AND its run
      # must print unittest's "Ran N tests" with N > 0 and exit 0. An emptied
      # file, or one that runs no test, fails here.
      - name: WipePinGcc Python tests
        run: |
          set -u
          for t in compiler/gcc-repair/test/test_wpin_gcc_record.py compiler/gcc-repair/test/test_check_gcc_fixture_loop.py; do
            [ -s "$t" ] || { echo "::error::no test file, or an empty one, at $t"; exit 1; }
            echo "--- $t"
            if out=$(python3 "$t" 2>&1); then rc=0; else rc=$?; fi
            printf '%s\n' "$out"
            [ "$rc" -eq 0 ] || { echo "::error::$t exited $rc"; exit 1; }
            ran=$(printf '%s\n' "$out" | sed -n 's/^Ran \([0-9][0-9]*\) tests\{0,1\} in .*/\1/p' | tail -n 1)
            [ -n "$ran" ] && [ "$ran" -gt 0 ] || { echo "::error::$t ran no test (no \"Ran N tests\" with N > 0)"; exit 1; }
            echo "$t: $ran test(s) ran"
          done

      # The harness exits 0 only when every check passed, and that is half of
      # the verdict. The other half is its report, read back: exactly the 21
      # checks named in the header above, every one passing, and a pluginSha256
      # equal to the sha256 of the .so the build step wrote, taken before the
      # harness runs. That is what fails a harness that exits 0 and writes no
      # report, a report measured on some other plugin, and a check that quietly
      # stopped running. The report left over from an earlier run is deleted
      # first, so it cannot stand in for this one. The fixtures are generated
      # into the lab, never into the checkout. This log is public, so the runner
      # paths in what the harness prints are replaced by placeholders.
      - name: Property observer non-invasiveness (noninvasive.mjs, 21 checks)
        run: |
          set -u
          lab="$RUNNER_TEMP/lab/pass-observer"
          so="$RUNNER_TEMP/build/pass-observer/libPropertyObserver.so"
          report="$lab/rq2/results/noninvasive.json"
          sanitise() { sed -e "s#$lab#<lab dir>#g" -e "s#$RUNNER_TEMP#<runner temp>#g" -e "s#$PWD#<checkout>#g"; }
          [ -s "$so" ] || { echo "::error::libPropertyObserver.so is missing or empty, so there is nothing to measure"; exit 1; }
          want=$(sha256sum "$so" | cut -d' ' -f1)
          rm -f "$report"
          OBS_LAB="$lab" bash compiler/pass-instrumentation/observer/tools/make-fixtures.sh >/dev/null || { echo "::error::make-fixtures.sh failed"; exit 1; }
          if out=$(OBS_LAB="$lab" OBS_PLUGIN="$so" node compiler/pass-instrumentation/observer/scripts/noninvasive.mjs 2>&1); then rc=0; else rc=$?; fi
          printf '%s\n' "$out" | sanitise
          [ "$rc" -eq 0 ] || { echo "::error::noninvasive.mjs exited $rc (2: a check failed, 3: the harness could not run)"; exit 1; }
          [ -s "$report" ] || { echo "::error::noninvasive.mjs exited 0 but left no report"; exit 1; }
          NI_REPORT="$report" NI_WANT_SHA256="$want" node -e '
            const fs = require("node:fs");
            let r;
            try { r = JSON.parse(fs.readFileSync(process.env.NI_REPORT, "utf8")); }
            catch (e) { console.log(`::error::the report could not be read (${e.code || e.name})`); process.exit(1); }
            if (r === null || typeof r !== "object") { console.log("::error::the report is not a JSON object"); process.exit(1); }
            const want = process.env.NI_WANT_SHA256;
            const ids = ["-O0", "-O1", "-O2", "-O3"]
              .flatMap((o) => ["NI-01", "NI-02", "NI-03", "NI-03b"].map((n) => n + o))
              .concat(["NI-04", "NI-05", "NI-06", "NI-07", "NI-08"]);
            const checks = Array.isArray(r.checks) ? r.checks : [];
            const passing = checks.filter((c) => c && c.pass === true).length;
            const bad = [];
            if (r.schemaVersion !== "noninvasive-v1") bad.push(`schemaVersion is ${r.schemaVersion}, not noninvasive-v1`);
            if (checks.length !== 21) bad.push(`it holds ${checks.length} checks, not 21`);
            if (checks.map((c) => c && c.id).sort().join(" ") !== ids.sort().join(" ")) bad.push("its check ids are not NI-01..NI-03b at -O0..-O3 plus NI-04..NI-08");
            if (r.passed !== 21 || passing !== 21) bad.push(`passed is ${r.passed} (${passing} checks with pass: true), not 21`);
            if (r.failed !== 0) bad.push(`failed is ${r.failed}, not 0`);
            if (r.pluginSha256 !== want) bad.push(`pluginSha256 is ${r.pluginSha256}, not ${want}, the sha256 of the .so this job built`);
            for (const b of bad) console.log(`::error::noninvasive.json: ${b}`);
            if (bad.length > 0) process.exit(1);
            console.log(`noninvasive.json: ${checks.length} checks, ${r.passed} passed, ${r.failed} failed; pluginSha256 ${r.pluginSha256} is the libPropertyObserver.so this job built`);
          '
